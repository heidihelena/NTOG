services:
  - type: web
    name: ntog-trends
    runtime: docker
    plan: free
    region: frankfurt
    # Docker paths are relative to rootDir for a monorepo service. Keep all
    # three fields together or Render can look for trends/trends/Dockerfile.
    rootDir: trends
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: checksPass
    domains:
      - trends.ntog.org
