name: Nordic lung trends

on:
  pull_request:
    paths:
      - "trends/**"
      - "render.yaml"
      - ".github/workflows/trends.yml"
  push:
    branches:
      - main
    paths:
      - "trends/**"
      - "render.yaml"
      - ".github/workflows/trends.yml"

permissions:
  contents: read

jobs:
  r-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trends
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::bslib
            any::digest
            any::dplyr
            any::ggplot2
            any::jsonlite
            any::officer
            any::readr
            any::rvg
            any::scales
            any::shiny
            any::svglite
            any::testthat
            any::zip
      - name: Verify reviewed release
        run: Rscript scripts/verify_release.R
      - name: Run tests
        run: Rscript tests/testthat.R
      - name: Load Shiny application
        run: |
          Rscript -e 'loaded <- source("app.R"); stopifnot(inherits(loaded$value, "shiny.appobj"))'

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: trends
          load: true
          push: false
          tags: ntog-trends:smoke
      - name: Verify container opens its HTTP port
        run: |
          container_id="$(docker run --detach \
            --env PORT=3838 \
            --publish 127.0.0.1:3838:3838 \
            ntog-trends:smoke)"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3838/ >/dev/null; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done

          docker logs "$container_id"
          exit 1
